<title>01 Reset & Counter: the rule</title>
<style>
.rw{position:absolute;left:-500px;display:flex;align-items:center;gap:22px;white-space:nowrap}
.tag{width:210px;box-sizing:border-box;text-align:center;font-size:28px;font-weight:600;border-radius:999px;padding:10px 0}
.act{font-size:44px;font-weight:600;letter-spacing:-.025em}
.ar{display:inline-flex}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row" style="transform:translate(-50%,-50%);gap:16px;color:#fff;font-size:48px;font-weight:600;letter-spacing:-.02em">Reset <span style="color:#FF5A1F">&amp;</span> Counter</div></div>
  <div class="L" id="Lcard">
    <div class="a" style="left:-500px;top:-150px;font-size:52px;font-weight:600;letter-spacing:-.03em;white-space:nowrap">Reset <span style="color:#FF5A1F">&amp;</span> Counter</div>
    <div class="a" style="left:-500px;top:-84px;font-size:28px;font-weight:500;color:#8A8782;white-space:nowrap">A speed-up is coming at the kitchen line</div>
    <div class="rw" id="r1" style="top:-22px"><span class="tag" id="t1" style="background:#F1EFEB">No read</span><span class="ar" id="a1"></span><span class="act" id="v1">Block &amp; reset</span></div>
    <div class="rw" id="r2" style="top:58px"><span class="tag" id="t2" style="background:#FF5A1F;color:#fff">Good read</span><span class="ar" id="a2"></span><span class="act" id="v2">Counter</span></div>
    <div class="a" id="chip" style="left:-500px;top:136px;font-size:24px;font-weight:500;color:#5E5B57;white-space:nowrap;background:#F1EFEB;border-radius:999px;padding:7px 18px"><span id="chipT"></span></div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
$('a1').innerHTML=M.icon('arrow',34,'#8A8782',2.6); $('a2').innerHTML=M.icon('arrow',34,'#FF5A1F',2.6);
const T=14.0;
const pin=(el,t0,t,dx=-18)=>{const v=M.vis(t,t0,null,{din:0,lin:0.26}); el.style.opacity=v.o; el.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none'; el.style.transform=`translateX(${(1-v.a)*dx}px)`;};
M.scene({
  W:1920,H:1080,bg:null,T,intro:0.1,center:[960,250],
  SH:{pill:{w:470,h:112,r:56,bg:'#0B0B0B',cam:1.15}, card:{w:1100,h:380,r:40,bg:'#FFFFFF',cam:1.0}},
  start:'pill', SEQ:[[1.0,'card']],
  layers:[
    {el:'Lpill',tin:null,tout:1.0},
    {el:'Lcard',tin:1.0,tout:null,update:(t)=>{
      // "if I don't see it" -> No read; "block and reset"; "if I see it" -> Good read; "go for it" -> Counter
      pin($('t1'),1.3,t); pin($('a1'),2.5,t); pin($('v1'),2.6,t);
      pin($('t2'),4.4,t); pin($('a2'),5.0,t); pin($('v2'),5.1,t);
      pin($('chip'),7.3,t,0);
      M.setText($('chipT'), t<10.3?"Partner's job: speed up":"Partner's job: speed up · pick a spot");
    }},
  ],
  geom:(t,g)=>{const e=M.eio((t-(T-0.6))/0.45); g.sc*=1-0.3*e; g.op*=1-e; return g;},
});
</script>
