<title>00 Title: The twoey dink</title>
<style>
.chip{display:inline-block;font-size:24px;font-weight:500;border-radius:999px;padding:7px 16px;background:#F1EFEB;color:#0B0B0B;white-space:nowrap}
.rw{position:absolute;left:-380px;display:flex;align-items:center;gap:18px;white-space:nowrap;font-size:30px;font-weight:600;letter-spacing:-.01em}
.rw .tag{width:190px;box-sizing:border-box;text-align:center;font-size:24px;font-weight:600;border-radius:999px;padding:9px 0}
</style>
<div data-slot="shape">
  <div class="L" id="Lpill"><div class="row" style="transform:translate(-50%,-50%);gap:16px;color:#fff;font-size:44px;font-weight:600;letter-spacing:-.02em">Twoey dink<span style="font-size:22px;font-weight:600;letter-spacing:0;border-radius:999px;padding:6px 14px;background:#FF5A1F">drill</span></div></div>
  <div class="L" id="Lcard">
    <div class="a" style="left:-380px;top:-172px"><span class="chip">Pickleball · Dink drill</span></div>
    <div class="a" style="left:-384px;top:-126px;font-size:88px;font-weight:600;letter-spacing:-.035em;white-space:nowrap">The twoey dink</div>
    <div class="a" style="left:-380px;top:-18px;font-size:32px;font-weight:500;color:#8A8782;white-space:nowrap">Read the spin before you lift</div>
    <div class="rw" id="r1" style="top:52px"><span class="tag" style="background:#F1EFEB">No spin</span>Slightly closed · forward</div>
    <div class="rw" id="r2" style="top:118px"><span class="tag" style="background:#0B0B0B;color:#fff">Heavy slice</span>Open · straight up</div>
  </div>
</div><!--/shape-->
<script>
const $=id=>document.getElementById(id);
const rowIn=(el,t0,t)=>{const v=M.vis(t,t0,null,{din:0,lin:0.28}); el.style.opacity=v.o; el.style.filter=v.blur>0.05?`blur(${v.blur}px)`:'none'; el.style.transform=`translateX(${(1-v.a)*-20}px)`;};
const OUT=5.0;
M.scene({
  W:1920,H:1080,bg:null,T:5.5,intro:0.1,center:[540,420],
  SH:{pill:{w:420,h:110,r:55,bg:'#0B0B0B',cam:1.3}, card:{w:860,h:430,r:40,bg:'#FFFFFF',cam:1.0}},
  start:'pill', SEQ:[[0.8,'card']],
  layers:[
    {el:'Lpill',tin:null,tout:0.8},
    {el:'Lcard',tin:0.8,tout:null,update:(t)=>{ rowIn($('r1'),1.7,t); rowIn($('r2'),2.2,t); }},
  ],
  // exit: shrink and fade so the footage takes over cleanly
  geom:(t,g)=>{ const e=M.eio((t-OUT)/0.4); g.sc*=1-0.35*e; g.op*=1-e; return g; },
});
</script>
